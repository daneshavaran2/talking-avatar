services:
  # ── اپلیکیشن اصلی ───────────────────────────────────────────────
  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://digitalhuman:${POSTGRES_PASSWORD:-digitalhuman}@postgres:5432/digitalhuman?schema=public
      MEDIA_ENGINE_URL: http://media-engine:8001
      N8N_BASE_URL: http://n8n:5678
    ports:
      - '3000:3000'
    volumes:
      - app-storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── پایگاه داده با افزونهٔ pgvector ─────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: digitalhuman
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-digitalhuman}
      POSTGRES_DB: digitalhuman
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U digitalhuman -d digitalhuman']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── سرور رسانهٔ بلادرنگ ─────────────────────────────────────────
  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml
    volumes:
      - ./deploy/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - '7880:7880'
      - '7881:7881'
      - '50000-50100:50000-50100/udp'
    restart: unless-stopped

  # ── اتوماسیون کسب‌وکار ──────────────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    environment:
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      GENERIC_TIMEZONE: Asia/Tehran
    volumes:
      - n8n-data:/home/node/.n8n
    ports:
      - '5678:5678'
    restart: unless-stopped

  # ── پردازش GPU: تنها سرویسی که به CUDA نیاز دارد (§۵.۲) ────────
  media-engine:
    build:
      context: ./services/media-engine
      dockerfile: Dockerfile
    environment:
      MEDIA_ENGINE_TOKEN: ${MEDIA_ENGINE_TOKEN:-}
      STT_MODEL: ${STT_MODEL:-large-v3}
      HF_HOME: /cache/huggingface
    volumes:
      - media-cache:/cache
      - app-storage:/app/storage
    ports:
      - '8001:8001'
    # برای فعال‌سازی GPU این بخش را از حالت کامنت خارج کنید:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    restart: unless-stopped

volumes:
  pgdata:
  n8n-data:
  media-cache:
  app-storage:
